---
name: Full CI Verification
'on':
  push:
    branches:
    - codex/full-ci-pilot
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Commit, tag or branch to deploy
        required: false
        default: ''
permissions:
  contents: read
jobs:
  node:
    name: API/Admin checks
    needs: native-node
    runs-on: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/codex/full-ci-pilot') && fromJSON('["milanium-linux-arm64",
      "repo-dos-taxi"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      PROMO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d platform_test" --health-interval
          10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-bookworm
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: "${{ inputs.deploy_ref || github.ref }}"
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.0
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download portable shared types from the required build job
      uses: actions/download-artifact@v4
      with:
        name: dos-shared-types
        path: packages/shared-types/dist
    - name: Test OTP, administration, promos and bonuses
      run: pnpm --filter @dos/api exec jest --runInBand test/integration/admin-creation.integration.spec.ts
        test/integration/promo-bonus.integration.spec.ts test/integration/admin.integration.spec.ts
        test/integration/smsc-otp.integration.spec.ts
    if: github.repository == 'milaniumkz/dos-taxi' && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/full-ci-pilot')
  mobile:
    name: Flutter checks
    runs-on: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/codex/full-ci-pilot') && fromJSON('["milanium-mac-arm64",
      "repo-dos-taxi"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: "${{ inputs.deploy_ref || github.ref }}"
    - name: Setup Flutter
      if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main'
        && github.ref != 'refs/heads/codex/full-ci-pilot')
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Select existing Mac Flutter 3.41.1
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
        || github.ref == 'refs/heads/codex/full-ci-pilot')
      run: |
        echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
        /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'
    - name: Install mobile dependencies
      working-directory: apps/mobile
      run: flutter pub get ${{ github.event_name != 'pull_request' && (github.ref
        == 'refs/heads/main' || github.ref == 'refs/heads/codex/full-ci-pilot') &&
        '--enforce-lockfile' || '' }}
    - name: Generate localizations
      working-directory: apps/mobile
      run: flutter gen-l10n
    - name: Analyze mobile
      working-directory: apps/mobile
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
    - name: Test mobile
      working-directory: apps/mobile
      run: flutter test
    - name: Build passenger web app
      working-directory: apps/mobile
      run: flutter build web --release -t lib/main_passenger_prod.dart --base-href
        /passenger/
    - name: Prepare passenger web metadata
      run: python3 scripts/prepare_ci_web.py passenger
    - name: Save checked passenger web app
      uses: actions/upload-artifact@v4
      with:
        name: passenger-web
        path: apps/mobile/build/web
        retention-days: 14
    - name: Build driver web app
      working-directory: apps/mobile
      run: flutter build web --release -t lib/main_driver_prod.dart --base-href /driver/
    - name: Prepare driver web metadata
      run: python3 scripts/prepare_ci_web.py driver
    - name: Save checked driver web app
      uses: actions/upload-artifact@v4
      with:
        name: driver-web
        path: apps/mobile/build/web
        retention-days: 14
    if: github.repository == 'milaniumkz/dos-taxi' && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/full-ci-pilot')
  native-node:
    runs-on: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/codex/full-ci-pilot') && fromJSON('["milanium-mac-arm64",
      "repo-dos-taxi"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      CI: 'true'
      DATABASE_URL: ''
      REDIS_URL: ''
      PROMO_TEST_DATABASE_URL: ''
      COREPACK_ENABLE_NETWORK: "${{ github.event_name != 'pull_request' && (github.ref
        == 'refs/heads/main' || github.ref == 'refs/heads/codex/full-ci-pilot') &&
        '0' || '1' }}"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: "${{ inputs.deploy_ref || github.ref }}"
    - uses: actions/setup-node@v4
      if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main'
        && github.ref != 'refs/heads/codex/full-ci-pilot')
      with:
        node-version: '20'
    - uses: pnpm/action-setup@v4
      if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main'
        && github.ref != 'refs/heads/codex/full-ci-pilot')
      with:
        version: 9.15.0
    - name: Select existing Node 20
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
        || github.ref == 'refs/heads/codex/full-ci-pilot')
      run: |
        echo /opt/homebrew/opt/node@20/bin >> "$GITHUB_PATH"
        test "$(/opt/homebrew/opt/node@20/bin/node -p 'process.versions.node.split(".")[0]')" = 20
    - run: corepack pnpm install --frozen-lockfile
    - run: corepack pnpm --filter @dos/shared-types build
    - run: corepack pnpm lint
    - run: corepack pnpm --filter @dos/api test:unit
    - run: python3 -m unittest discover -s deploy/vps/scripts -p 'test_*.py'
    - run: corepack pnpm --filter @dos/api typecheck
    - run: corepack pnpm --filter @dos/admin typecheck
    - run: corepack pnpm --filter @dos/api build
    - run: corepack pnpm --filter @dos/admin build
    - name: Share portable TypeScript build for the Linux integration gate
      uses: actions/upload-artifact@v4
      with:
        name: dos-shared-types
        path: packages/shared-types/dist
        if-no-files-found: error
        retention-days: 1
    if: github.repository == 'milaniumkz/dos-taxi' && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/full-ci-pilot')
