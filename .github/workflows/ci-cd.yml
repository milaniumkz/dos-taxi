name: DOS CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Commit, tag or branch to deploy"
        required: false
        default: ""

concurrency:
  group: dos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node:
    name: API/Admin checks
    needs: native-node
    runs-on: ubuntu-latest
    env:
      PROMO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download portable shared types from the required build job
        uses: actions/download-artifact@v4
        with:
          name: dos-shared-types
          path: packages/shared-types/dist

      - name: Test OTP, administration, promos and bonuses
        run: >-
          pnpm --filter @dos/api exec jest --runInBand
          test/integration/admin-creation.integration.spec.ts
          test/integration/promo-bonus.integration.spec.ts
          test/integration/admin.integration.spec.ts
          test/integration/smsc-otp.integration.spec.ts

  mobile:
    name: Flutter checks
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["milanium-mac-arm64", "repo-dos-taxi"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.deploy_ref || github.ref }}

      - name: Setup Flutter
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select existing Mac Flutter 3.41.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--enforce-lockfile' || '' }}

      - name: Generate localizations
        working-directory: apps/mobile
        run: flutter gen-l10n

      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test mobile
        working-directory: apps/mobile
        run: flutter test

      - name: Build passenger web app
        working-directory: apps/mobile
        run: flutter build web --release -t lib/main_passenger_prod.dart --base-href /passenger/

      - name: Prepare passenger web metadata
        run: python3 scripts/prepare_ci_web.py passenger

      - name: Save checked passenger web app
        uses: actions/upload-artifact@v4
        with:
          name: passenger-web
          path: apps/mobile/build/web
          retention-days: 14

      - name: Build driver web app
        working-directory: apps/mobile
        run: flutter build web --release -t lib/main_driver_prod.dart --base-href /driver/

      - name: Prepare driver web metadata
        run: python3 scripts/prepare_ci_web.py driver

      - name: Save checked driver web app
        uses: actions/upload-artifact@v4
        with:
          name: driver-web
          path: apps/mobile/build/web
          retention-days: 14

  deploy-production:
    name: Deploy VPS production
    runs-on: ubuntu-latest
    needs:
      - node
      - mobile
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: dos-production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref || github.sha }}

      - name: Resolve release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download checked passenger web app
        uses: actions/download-artifact@v4
        with:
          name: passenger-web
          path: apps/mobile/build/web

      - name: Download checked driver web app
        uses: actions/download-artifact@v4
        with:
          name: driver-web
          path: apps/mobile/build/driver-web

      - name: Upload release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH/_incoming/${RELEASE_SHA}'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='apps/admin/.next/' \
            --exclude='apps/api/dist/' \
            --exclude='apps/mobile/build/' \
            --exclude='builds/' \
            --exclude='artifacts/' \
            --exclude='infra/data/' \
            --exclude='.DS_Store' \
            --exclude='._*' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='deploy/.env*.yaml' \
            --exclude='deploy/.env*.json' \
            --exclude='deploy/vps/.env' \
            --exclude='deploy/vps/backups/' \
            --exclude='deploy/vps/nginx/certbot/' \
            --exclude='deploy/hosting-public/' \
            --exclude='deploy/hosting-passenger/' \
            --exclude='deploy/hosting-driver/' \
            --exclude='apps/api/.env.local' \
            --exclude='apps/mobile/android/*.jks' \
            --exclude='apps/mobile/android/*.keystore' \
            --exclude='apps/mobile/android/key.properties' \
            -e "ssh -p ${VPS_PORT:-22}" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/_incoming/${RELEASE_SHA}/"
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH/_incoming/${RELEASE_SHA}/_web/passenger'"
          rsync -az --delete -e "ssh -p ${VPS_PORT:-22}" \
            apps/mobile/build/web/ "$VPS_USER@$VPS_HOST:$VPS_PATH/_incoming/${RELEASE_SHA}/_web/passenger/"
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH/_incoming/${RELEASE_SHA}/_web/driver'"
          rsync -az --delete -e "ssh -p ${VPS_PORT:-22}" \
            apps/mobile/build/driver-web/ "$VPS_USER@$VPS_HOST:$VPS_PATH/_incoming/${RELEASE_SHA}/_web/driver/"

      - name: Promote release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SMSC_LOGIN: ${{ secrets.SMSC_LOGIN }}
          SMSC_PASSWORD: ${{ secrets.SMSC_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, shlex, subprocess
          login = os.environ.get("SMSC_LOGIN", "")
          password = os.environ.get("SMSC_PASSWORD", "")
          if bool(login) != bool(password):
              raise SystemExit("Configure both SMSC_LOGIN and SMSC_PASSWORD secrets")
          settings = {"SMSC_LOGIN": login, "SMSC_PASSWORD": password} if login else {}
          path, sha = os.environ["VPS_PATH"], os.environ["RELEASE_SHA"]
          incoming = f"{path}/_incoming/{sha}"
          command = shlex.join(["bash", f"{incoming}/deploy/vps/scripts/ci-promote-release.sh", incoming, path, sha, "--runtime-config-stdin"])
          subprocess.run(["ssh", "-p", os.environ.get("VPS_PORT") or "22", f'{os.environ["VPS_USER"]}@{os.environ["VPS_HOST"]}', command], input=json.dumps(settings), text=True, check=True)
          PY

  native-node:
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["milanium-mac-arm64", "repo-dos-taxi"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      CI: 'true'
      DATABASE_URL: ''
      REDIS_URL: ''
      PROMO_TEST_DATABASE_URL: ''
      COREPACK_ENABLE_NETWORK: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.deploy_ref || github.ref }}
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          version: 9.15.0
      - name: Select existing Node 20
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo /opt/homebrew/opt/node@20/bin >> "$GITHUB_PATH"
          test "$(/opt/homebrew/opt/node@20/bin/node -p 'process.versions.node.split(".")[0]')" = 20
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @dos/shared-types build
      - run: corepack pnpm lint
      - run: corepack pnpm --filter @dos/api test:unit
      - run: python3 -m unittest discover -s deploy/vps/scripts -p 'test_*.py'
      - run: corepack pnpm --filter @dos/api typecheck
      - run: corepack pnpm --filter @dos/admin typecheck
      - run: corepack pnpm --filter @dos/api build
      - run: corepack pnpm --filter @dos/admin build
      - name: Share portable TypeScript build for the Linux integration gate
        uses: actions/upload-artifact@v4
        with:
          name: dos-shared-types
          path: packages/shared-types/dist
          if-no-files-found: error
          retention-days: 1
