name: DOS Production Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowed operation"
        required: true
        type: choice
        options:
          - health
          - logs
          - restart
          - rollback
          - https-status
          - https-ip
      rollback_backup:
        description: "Backup directory for rollback, e.g. backups/predeploy-YYYYMMDD-HHMMSS-abcdef123456"
        required: false
        default: ""

concurrency:
  group: dos-production-ops
  cancel-in-progress: false

jobs:
  run:
    name: Run production operation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout operational scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_BACKUP: ${{ inputs.rollback_backup }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            health|logs|restart|rollback|https-status|https-ip) ;;
            *) echo "Unsupported operation"; exit 1 ;;
          esac
          if [[ "$OPERATION" == https-* ]]; then
            python3 - <<'PY'
          import os, shlex, subprocess
          host = f'{os.environ["VPS_USER"]}@{os.environ["VPS_HOST"]}'
          port = os.environ.get("VPS_PORT") or "22"
          script = f'/tmp/dos-https-{os.environ["GITHUB_SHA"]}.sh'
          renderer = f'/tmp/dos-https-{os.environ["GITHUB_SHA"]}.py'
          mode = "status" if os.environ["OPERATION"] == "https-status" else "setup"
          subprocess.run(["scp", "-P", port, "deploy/vps/scripts/https-ip.sh", f"{host}:{script}"], check=True)
          if mode == "setup":
              subprocess.run(["scp", "-P", port, "deploy/vps/scripts/render-ip-https.py", f"{host}:{renderer}"], check=True)
          command = shlex.join(["bash", script, mode, f'{os.environ["VPS_PATH"]}/deploy/vps', "89.126.200.51", renderer])
          subprocess.run(["ssh", "-p", port, host, command], check=True)
          PY
          else
            ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
              "cd '$VPS_PATH/deploy/vps' && bash scripts/ci-ops.sh '$OPERATION' '$ROLLBACK_BACKUP'"
          fi
      - name: Verify public IP HTTPS and retained app hostname
        if: inputs.operation == 'https-ip'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://89.126.200.51/api/v1/health/ready
          curl --fail --silent --show-error https://dos.89.126.200.51.sslip.io/api/v1/health
