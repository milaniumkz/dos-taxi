openapi: 3.0.3
info:
  title: DOS / Kaspi online balance API
  version: 1.1.0
  description: HTTPS GET check/pay protocol. No request body or card data. Access
    restricted to confirmed bank source IPs. Successful check returns structured driver
    identity in fields; surname and given name must be present.
servers:
- url: https://89.126.200.51
  description: Verified IP HTTPS endpoint with automatic certificate renewal; bank
    acceptance required before enabling
paths:
  /api/v1/payments/kaspi:
    get:
      operationId: kaspiOnlinePayment
      summary: Check driver account or credit balance
      parameters:
      - in: query
        name: command
        required: true
        description: 'check: account verification; pay: balance credit'
        schema:
          type: string
          enum:
          - check
          - pay
        example: pay
      - in: query
        name: txn_id
        required: true
        description: Bank transaction ID, string to retain all 18 digits
        schema:
          type: string
          pattern: ^\d{1,18}$
        example: '123456789012345678'
      - in: query
        name: account
        required: true
        description: Verified driver phone, 11 digits without +
        schema:
          type: string
          pattern: ^7\d{10}$
        example: '77010000000'
      - in: query
        name: sum
        required: true
        description: KZT with two decimal places; ignored for check
        schema:
          type: string
          pattern: ^\d{1,10}\.\d{2}$
        example: '5000.00'
      - in: query
        name: txn_date
        required: false
        description: Required for pay; bank accounting date YYYYMMDDhhmmss
        schema:
          type: string
          pattern: ^\d{14}$
        example: '20261007140000'
      responses:
        '200':
          description: Bank protocol response; result=0 only after committed payment
            (pay)
          content:
            application/json:
              schema:
                type: object
                required:
                - txn_id
                - result
                - comment
                properties:
                  txn_id:
                    type: string
                  result:
                    type: integer
                    enum:
                    - 0
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                  comment:
                    type: string
                  prv_txn_id:
                    type: string
                    description: DOS numeric payment ID, present on successful pay
                  sum:
                    type: string
                    example: '5000.00'
                  fields:
                    type: object
                    description: Successful check only. Verified driver identity;
                      empty patronymic if absent. Not returned for unavailable accounts.
                    required:
                    - field1
                    - field2
                    - field3
                    - field4
                    properties:
                      field1:
                        type: object
                        required:
                        - '@name'
                        - '#text'
                        properties:
                          '@name':
                            type: string
                            enum:
                            - last_name
                          '#text':
                            type: string
                            example: Иванов
                      field2:
                        type: object
                        required:
                        - '@name'
                        - '#text'
                        properties:
                          '@name':
                            type: string
                            enum:
                            - first_name
                          '#text':
                            type: string
                            example: Иван
                      field3:
                        type: object
                        required:
                        - '@name'
                        - '#text'
                        properties:
                          '@name':
                            type: string
                            enum:
                            - middle_name
                          '#text':
                            type: string
                            example: Иванович
                      field4:
                        type: object
                        required:
                        - '@name'
                        - '#text'
                        properties:
                          '@name':
                            type: string
                            enum:
                            - phone
                          '#text':
                            type: string
                            example: '+77010000000'
              examples:
                check:
                  value:
                    txn_id: '123456789012345677'
                    result: 0
                    comment: OK
                    fields:
                      field1:
                        '@name': last_name
                        '#text': Иванов
                      field2:
                        '@name': first_name
                        '#text': Иван
                      field3:
                        '@name': middle_name
                        '#text': Иванович
                      field4:
                        '@name': phone
                        '#text': '+77010000000'
                pay:
                  value:
                    txn_id: '123456789012345678'
                    prv_txn_id: '2016'
                    result: 0
                    sum: '5000.00'
                    comment: OK
        '400':
          description: Invalid query syntax
        '403':
          description: Integration disabled or source IP denied
