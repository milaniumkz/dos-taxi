name: dos_mobile
description: DOS passenger and driver applications built on a shared Flutter codebase.
publish_to: 'none'
version: 1.0.27+31

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  go_router: ^14.8.1
  dio: ^5.8.0+1
  dio_cache_interceptor: ^3.5.1
  flutter_map: ^7.0.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  socket_io_client: ^3.1.2
  get_it: ^8.0.3
  injectable: ^2.5.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
